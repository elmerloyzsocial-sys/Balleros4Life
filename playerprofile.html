<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Player Profile - Ballero4Life</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    .site-header {
      background-image: url('images/background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
      padding: 20px;
    }
    .header-content {
      max-width: 1200px;
      margin: 0 auto;
    }
    .site-header h1 {
      margin: 0;
      font-size: 2.5em;
    }
    .site-header nav {
      margin-top: 10px;
    }
    .site-header nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-size: 1.1em;
    }
    .site-header nav a:hover {
      text-decoration: underline;
    }
    .player-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .player-card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border: 1px solid #e5e5e5;
    }
    .player-card-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 2px solid #f0f0f5;
    }
    .player-photo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #f7b32b;
    }
    .player-info h3 {
      margin: 0 0 5px 0;
      color: #263238;
      font-size: 1.3em;
    }
    .player-info .player-number {
      color: #666;
      font-size: 0.9em;
    }
    .player-stats {
      margin-top: 10px;
    }
    .player-stats h4 {
      margin: 0 0 10px 0;
      color: #263238;
      font-size: 1em;
      border-bottom: 1px solid #e5e5e5;
      padding-bottom: 5px;
    }
    .stats-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }
    .stat-box {
      text-align: center;
      padding: 10px;
      background: #f9f9fc;
      border-radius: 5px;
    }
    .stat-box .stat-label {
      font-size: 0.8em;
      color: #666;
      margin-bottom: 3px;
    }
    .stat-box .stat-value {
      font-size: 1.4em;
      font-weight: bold;
      color: #263238;
    }
    .stats-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9em;
    }
    .stats-table th,
    .stats-table td {
      padding: 8px;
      text-align: center;
      border: 1px solid #e5e5e5;
    }
    .stats-table th {
      background: #f0f0f5;
      font-weight: 600;
      color: #263238;
    }
    .stats-table tr:hover {
      background: #f9f9fc;
    }
    .no-stats {
      text-align: center;
      color: #999;
      padding: 20px;
      font-style: italic;
    }
    @media (max-width: 768px) {
      .player-grid {
        grid-template-columns: 1fr;
      }
      .stats-summary {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-content">
      <h1>Ballero4Life</h1>
      <nav>
        <a href="index.html"><i class="fas fa-home"></i> Home</a>
        <a href="gallery.html"><i class="fas fa-images"></i> Gallery</a>
        <a href="stats.html"><i class="fas fa-chart-bar"></i> Stats</a>
        <a href="calendar.html"><i class="fas fa-calendar-alt"></i> Calendar</a>
        <a href="advice.html"><i class="fas fa-basketball-ball"></i> Coach Advice</a>
        <a href="plays.html"><i class="fas fa-chalkboard"></i> Plays</a>
        <a href="standing.html"><i class="fas fa-list-ol"></i> Standings</a>
        <a href="photos.html"><i class="fas fa-photo-film"></i> Player Photos</a>
        <a href="playerprofile.html"><i class="fas fa-id-card"></i> Player Profile</a>
        <a href="playoff.html"><i class="fas fa-trophy"></i> Playoffs</a>
      </nav>
    </div>
  </header>
  <main>
    <a href="index.html" class="back">&larr; Home</a>
    <section>
      <h1>Player Profiles</h1>
      <p>Combined view of player information, photos, and statistics</p>
      <div id="playerProfiles" class="player-grid"></div>
    </section>
  </main>
  <script src="script.js"></script>
  <script src="playerprofile.js"></script>
  <footer>
    &copy; 2025 Balleros4Life &mdash; Mobile Club Portal
  </footer>
</body>
</html>
